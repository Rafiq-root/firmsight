name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:
    branches: [main, devlop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[test,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke test installed wheel and packaged lab assets
        run: |
          python -m pip install --no-deps --target wheel-smoke dist/*.whl
          PYTHONPATH=wheel-smoke python -m firmsight.cli profiles --json
          PYTHONPATH=wheel-smoke python -c 'from pathlib import Path; import firmsight; root=Path(firmsight.__file__).parent; assert (root/"sandbox"/"Dockerfile.extractor").is_file(); assert (root/"profiles"/"arm-virt.json").is_file()'
