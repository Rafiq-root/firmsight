[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmsight"
version = "0.1.0"
description = "A safe starter toolkit for IoT firmware triage and emulation preparation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FirmSight contributors"}]
dependencies = []

[project.optional-dependencies]
trace = ["r2pipe>=1.8"]
test = ["pytest>=7"]

[project.scripts]
firmsight = "firmsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
